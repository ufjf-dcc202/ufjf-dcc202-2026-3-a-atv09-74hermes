<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC 202 Exemplo01</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        ul{
            list-style: none;
            padding: 0;
            margin: 0;}
            
        
            ul >li{
                
                border: 1px solid green;
                background-color: rgb(205, 25, 25);
        
        }
        
        .desconstructed-pancake {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;


        }
        .desconstructed-pancake > * { 
            flex-grow: 1;
            width: 120px;
            flex: 1 1 120px;
        }

        .sidebar-say{
            display: grid;
            grid-template-columns: minmax (9ch, 20%) 1fr;
            gap: 10px;
        }
    
        
    </style>

</head>
<body>
    <main>
        <article class="sidebar-say">
            <section>

            
                <li>Marquinho</li>
                <li>Zezinho</li>
                <li>Iguinho</li>
                <li>Leandrinho</li>
                
            </ul>
            </section>
            <section>
                Lorem ipsum dolor sit amet consectetur adipisicing elit. 
                Est excepturi provident illum ut quae, molestiae 
                quod delectus ea ducimus autem, odit doloremque dolore dolores, aut culpa temp
                ora. Blanditiis, modi sequi.
            </section>
        </article>
    </main>
</body>
</html>
