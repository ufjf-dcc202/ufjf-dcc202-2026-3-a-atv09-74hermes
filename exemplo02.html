<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCC 202 Exemplo01</title>
    <link rel="stylesheet" href="estilo.css">
    <style>
        ul{
            list-style: none;
            padding: 0;
            margin: 0;}
            
        {
            ul >li{
                
                border: 1px solid green;
                background-color: rgb(205, 25, 25);
        
        }
        }
        .desconstructed-pancake {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;


        }
        .desconstructed-pancake > * { 
            flex-grow: 1;
            width: 120px;
            flex: 1 1 120px;
        }

        }
        
    </style>

</head>
<body>
    <main>
        <article>
            <ul class=" desconstructed-pancake">
                <li>Marquinho</li>
                <li>Zezinho</li>
                <li>Iguinho</li>
                <li>Leandrinho</li>
            </ul>
        </article>
    </main>
</body>
</html>
